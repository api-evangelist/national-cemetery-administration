aid: national-cemetery-administration
name: National Cemetery Administration
description: >-
  The National Cemetery Administration (NCA) is an agency of the U.S.
  Department of Veterans Affairs that provides burial and memorial benefits
  to veterans and their eligible family members. NCA does not currently expose
  a documented public REST API; access is via web tools such as the
  Nationwide Gravesite Locator and Cemetery Finder, with broader data
  available through VA Open Data.
